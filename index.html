<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazar d'Épervine</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Catalogue du Bazar d'Épervine : articles disponibles en ce moment, enchantements proposés et leurs prix en septims.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Metamorphous&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Couleurs de la bannière d'Épervine : violet clair, violet, violet foncé, noir, sur fond crème. */
  --parchemin: #fff3e2;
  --parchemin-clair: #fffaf3;
  --parchemin-fonce: #efe0c8;
  --encre: #111014;
  --encre-douce: #4a4458;
  --brun: #2e2475;
  --bande: #2e2475;
  --nuit: #0f0d14;
  --or: #bbbbf7;
  --or-fonce: #3a2f9e;
  --violet: #675de8;
  --violet-clair: #bbbbf7;
  --violet-fonce: #2e2475;
  --enchant: #5146c9;
  --trait: rgba(46, 36, 117, .22);
  --gothique: UnifrakturMaguntia, "Old English Text MT", serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
  margin: 0;
  background: var(--parchemin);
  color: var(--encre);
  font-family: Alegreya, Georgia, serif;
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; }
img { display: block; max-width: 100%; }

/* Barre du haut */
.barre {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 18px;
  padding: 0 20px; height: 56px;
  background: rgba(15, 13, 20, .94);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(187, 187, 247, .18);
}
.marque {
  font-family: var(--gothique); color: var(--violet-clair); text-decoration: none;
  font-size: 1.35rem; white-space: nowrap; flex: 0 0 auto;
}
.menu {
  display: flex; gap: 4px; margin-left: auto; overflow-x: auto;
  scrollbar-width: none; min-width: 0;
}
.menu::-webkit-scrollbar { display: none; }
.menu a {
  font-family: Metamorphous, serif; font-size: .9rem; color: #d9d1bd;
  text-decoration: none; white-space: nowrap; padding: 6px 10px; border-radius: 4px;
}
.menu a:hover { color: #fff; }
.menu a.actif { color: #fff; background: var(--violet-fonce); }
.loupe {
  flex: 0 0 auto; background: none; border: 0; color: #d9d1bd; cursor: pointer;
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
}
.loupe:hover { color: #fff; background: rgba(255,255,255,.08); }
.recherche-zone {
  display: none; position: sticky; top: 56px; z-index: 9;
  background: rgba(15, 13, 20, .96); padding: 10px 20px 14px;
}
.recherche-zone.ouverte { display: block; }
#recherche {
  display: block; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 10px 14px; border-radius: 6px; border: 1px solid rgba(187,187,247,.35);
  background: #1c1826; color: #f4ecd8; font: inherit; font-size: 17px;
}
#recherche:focus { outline: 2px solid var(--or); outline-offset: 1px; }

/* Bannière : étendard violet suspendu à une hampe, sur fond sombre losangé. */
.banniere {
  position: relative; overflow: hidden; text-align: center;
  background: radial-gradient(ellipse at 50% 35%, #3b2c8e 0%, #22195a 45%, #0f0b1f 100%);
  padding: 34px 16px 46px;
  border-bottom: 3px solid var(--violet-clair);
  box-shadow: inset 0 -6px 0 #0f0b1f;
}
.banniere svg.fond { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.etendard {
  position: relative; display: inline-block; width: min(780px, 100%);
  filter: drop-shadow(0 14px 18px rgba(0, 0, 0, .55));
}
.hampe {
  position: relative; height: 12px; margin: 0 -26px; border-radius: 6px;
  background: linear-gradient(#4b4b63, #111014 60%, #000);
  box-shadow: 0 2px 0 rgba(187, 187, 247, .25) inset;
}
.hampe::before, .hampe::after {
  content: ""; position: absolute; top: -5px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--violet-clair) 40%, #6f6bc4 100%);
  box-shadow: 0 0 0 2px #111014;
}
.hampe::before { left: -14px; } .hampe::after { right: -14px; }
.toile, .toile .bord, .toile .coeur {
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--pointe)), 50% 100%, 0 calc(100% - var(--pointe)));
}
.toile { --pointe: 46px; margin: -3px 14px 0; background: #0b0912; padding: 0 2px 3px; }
.toile .bord { --pointe: 44px; background: linear-gradient(#d4d4ff, var(--violet-clair) 40%, #9a98ec); padding: 0 8px 9px; }
.toile .coeur {
  --pointe: 40px; position: relative;
  background:
    linear-gradient(90deg, rgba(0,0,0,.22), transparent 12%, transparent 88%, rgba(0,0,0,.22)),
    repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,255,255,.025) 6px 7px),
    linear-gradient(#5d52e0, var(--violet) 35%, #4a3fc4 75%, #3a2fa6);
  padding: 26px 24px 64px; box-shadow: inset 0 0 0 1px rgba(15, 11, 31, .6);
}
.toile .coeur::before {
  content: ""; position: absolute; inset: 10px 10px auto; height: calc(100% - 20px - 30px);
  border: 1px solid rgba(220, 218, 255, .45); pointer-events: none;
}
.toile .embleme { display: block; width: 62px; height: 62px; margin: 0 auto 6px; color: #e6e4ff; }
.banniere h1 {
  margin: 0; font-family: var(--gothique); font-weight: 400; color: #fbf8ff;
  font-size: clamp(2.3rem, 8vw, 4.8rem); line-height: 1.05; letter-spacing: .01em;
  text-shadow: 0 2px 0 #1b1450, 0 4px 14px rgba(15, 11, 31, .55);
}
.banniere .devise {
  margin: 12px auto 0; max-width: 34em; font-family: Alegreya, Georgia, serif;
  font-variant: small-caps; letter-spacing: .12em; font-size: clamp(.95rem, 2.3vw, 1.15rem); color: #e2e0ff;
}
.banniere .devise::before, .banniere .devise::after { content: " \2766 "; color: var(--violet-clair); letter-spacing: 0; }
.banniere.petite { padding: 22px 16px 30px; }
.banniere.petite .etendard { width: min(620px, 100%); }
.banniere.petite .toile .coeur { padding: 16px 20px 50px; }
.banniere.petite .embleme { width: 40px; height: 40px; margin-bottom: 2px; }
.banniere.petite h1 { font-size: clamp(1.9rem, 6vw, 3.3rem); }

main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 36px 20px 40px; }
h2 {
  font-family: var(--gothique); font-weight: 400; color: var(--encre);
  font-size: clamp(1.8rem, 4.6vw, 2.5rem); line-height: 1.2; margin: 0 0 16px; text-align: center;
}
.filet {
  width: 220px; height: 14px; margin: 0 auto 28px; display: block; color: var(--brun);
}

/* Accueil */
.presentation {
  display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; margin-bottom: 48px;
}
.presentation .blason {
  background: radial-gradient(ellipse at 50% 40%, #3b2c8e, #1a1442 60%, #0f0b1f);
  border: 3px solid var(--violet-clair); outline: 2px solid var(--encre);
  border-radius: 2px; padding: 24px; display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(46, 36, 117, .25); aspect-ratio: 4 / 3;
}
.presentation .blason svg { width: 70%; height: auto; }
.presentation .texte { text-align: center; }
.presentation .texte h2 { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.presentation .texte p { margin: 0 0 12px; font-size: 1.05rem; }
.rayons {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
}
.rayon {
  position: relative; display: flex; flex-direction: column; text-decoration: none;
  background: var(--parchemin-clair); border: 1px solid var(--trait); border-radius: 4px; overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.rayon:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(46, 36, 117, .2); border-color: var(--violet); }
.rayon .vignette { aspect-ratio: 4 / 3; background: var(--bande); }
.rayon .vignette img { width: 100%; height: 100%; object-fit: cover; }
.rayon .nom { font-family: Metamorphous, serif; font-size: 1.1rem; padding: 12px 14px 2px; }
.rayon .nb { font-size: .92rem; color: var(--encre-douce); padding: 0 14px 12px; font-style: italic; }

/* Page d'une catégorie */
.articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
.article {
  display: flex; flex-direction: column; background: var(--parchemin-clair);
  border: 1px solid var(--trait); border-radius: 4px; overflow: hidden;
  box-shadow: 0 2px 0 rgba(46, 36, 117, .08);
}
.article .photo { aspect-ratio: 4 / 5; background: var(--bande); position: relative; }
.article .photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.article .photo .ornement { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(187, 187, 247, .35); }
.article .photo .ornement svg { width: 46%; height: auto; }
.article .infos { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.article h3 { margin: 0; font-family: Metamorphous, serif; font-weight: 400; font-size: 1.08rem; line-height: 1.3; overflow-wrap: anywhere; }
.article .enchant { margin: 0; font-size: .95rem; color: var(--enchant); font-style: italic; }
.article .rubrique { margin: 0; font-size: .85rem; color: var(--encre-douce); }
.article .prix {
  margin-top: auto; padding-top: 8px; font-family: Metamorphous, serif; font-size: 1.15rem; color: var(--or-fonce);
}
.article .prix small { font-family: Alegreya, serif; font-size: .85rem; color: var(--encre-douce); }
.article .prix.demande { font-family: Alegreya, serif; font-style: italic; font-size: .95rem; color: var(--encre-douce); }

/* Atelier d'enchantement */
.atelier {
  display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center;
  text-decoration: none; color: #ece9ff; margin: 0 0 48px; padding: 22px 26px;
  background:
    radial-gradient(ellipse at 15% 50%, rgba(187, 187, 247, .22), transparent 55%),
    linear-gradient(120deg, #1a1442, #2e2475 60%, #3a2fa6);
  border: 2px solid var(--violet-clair); outline: 2px solid var(--encre); border-radius: 2px;
  box-shadow: 0 6px 20px rgba(46, 36, 117, .25);
  transition: transform .15s ease, box-shadow .15s ease;
}
.atelier:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(46, 36, 117, .35); }
.atelier .rune { width: 64px; height: 64px; color: var(--violet-clair); }
.atelier strong { display: block; font-family: var(--gothique); font-weight: 400; font-size: clamp(1.5rem, 4vw, 2rem); color: #fff; line-height: 1.15; }
.atelier span { font-style: italic; color: #d6d4fb; }
.atelier .tarif { font-family: Metamorphous, serif; font-size: 1.3rem; color: #fff; white-space: nowrap; text-align: right; font-style: normal; }
.atelier .tarif small { display: block; font-family: Alegreya, serif; font-size: .85rem; color: #d6d4fb; font-style: italic; }

.intro-atelier { max-width: 40em; margin: 0 auto 30px; text-align: center; font-size: 1.05rem; }
.intro-atelier p { margin: 0 0 10px; }
.intro-atelier .remarque { font-size: .95rem; color: var(--encre-douce); font-style: italic; }
.enchantements { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.enchantement {
  position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 4px 14px; align-items: start;
  background: var(--parchemin-clair); border: 1px solid var(--trait); border-left: 4px solid var(--violet);
  border-radius: 4px; padding: 16px 16px 14px;
  box-shadow: 0 2px 0 rgba(46, 36, 117, .08);
}
.enchantement .rune {
  grid-row: span 3; width: 48px; height: 48px; padding: 9px; border-radius: 50%;
  color: var(--violet-clair); background: radial-gradient(circle at 50% 40%, #3b2c8e, #1a1442);
  box-shadow: 0 0 0 2px var(--violet-clair), 0 0 14px rgba(103, 93, 232, .45);
}
.enchantement h3 { margin: 0; font-family: Metamorphous, serif; font-weight: 400; font-size: 1.1rem; line-height: 1.3; }
.enchantement .effet { margin: 0; color: var(--enchant); font-style: italic; }
.enchantement .prix { margin-top: 6px; font-family: Metamorphous, serif; font-size: 1.15rem; color: var(--or-fonce); }
.enchantement .prix small { font-family: Alegreya, serif; font-size: .85rem; color: var(--encre-douce); }
.enchantement .prix.demande { font-family: Alegreya, serif; font-style: italic; font-size: .95rem; color: var(--encre-douce); }
.titre-resultats { font-family: Metamorphous, serif; font-size: 1.15rem; text-align: left; margin: 30px 0 14px; color: var(--violet-fonce); }

.message { text-align: center; font-style: italic; color: var(--encre-douce); margin: 40px 0; }
.message button {
  display: block; margin: 16px auto 0; font-family: Metamorphous, serif; font-size: .9rem;
  padding: 8px 18px; border-radius: 999px; border: 1px solid var(--brun); background: transparent;
  color: var(--encre); cursor: pointer;
}
.message button:hover { background: var(--violet-clair); }
.fantome { background: var(--parchemin-fonce); border-radius: 4px; aspect-ratio: 4 / 5; animation: lueur 1.4s ease-in-out infinite; }
@keyframes lueur { 50% { opacity: .55; } }

footer {
  text-align: center; font-size: .9rem; color: #cfc8e0; background: var(--nuit);
  padding: 22px 20px; font-style: italic;
}

/* Agrandissement d'une photo */
.loupe-photo {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 8, 16, .9);
  display: none; place-items: center; padding: 20px; cursor: zoom-out;
}
.loupe-photo.ouverte { display: grid; }
.loupe-photo img { max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.loupe-photo p { color: #f4ecd8; font-family: Metamorphous, serif; text-align: center; margin: 12px 0 0; }

@media (max-width: 720px) {
  body { font-size: 17px; }
  .barre { padding: 0 12px; gap: 10px; }
  .marque { display: none; }
  .menu { margin-left: 0; }
  .hampe { margin: 0 -6px; }
  .hampe::before { left: -6px; } .hampe::after { right: -6px; }
  .toile { margin: -3px 8px 0; }
  .toile .coeur { padding: 20px 14px 56px; }
  .banniere .devise { letter-spacing: .06em; }
  .banniere .devise::before, .banniere .devise::after { content: none; }
  main { padding: 26px 16px 32px; }
  .presentation { grid-template-columns: 1fr; gap: 22px; }
  .presentation .blason { aspect-ratio: 16 / 9; }
  .presentation .blason svg { width: 45%; }
  .rayons { grid-template-columns: 1fr 1fr; gap: 10px; }
  .rayon .nom { font-size: .98rem; padding: 10px 10px 0; }
  .rayon .nb { padding: 0 10px 10px; font-size: .85rem; }
  .articles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .article .infos { padding: 9px 10px 11px; }
  .article h3 { font-size: .98rem; }
  .article .prix { font-size: 1rem; }
  .atelier { grid-template-columns: auto 1fr; gap: 6px 16px; padding: 18px; }
  .atelier .rune { width: 48px; height: 48px; grid-row: span 2; }
  .atelier .tarif { text-align: left; grid-column: 2; font-size: 1.1rem; }
  .enchantements { grid-template-columns: 1fr; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { .fantome { animation: none; } .rayon, .atelier { transition: none; } }
</style>
</head>

<!-- Dessins réutilisés : l'épervier du blason et le filet décoratif. -->

        <path d="M36 9 l1.4 3 3 1.4 -3 1.4 -1.4 3 -1.4 -3 -3 -1.4 3 -1.4 Z M11 33 l1 2 2 1 -2 1 -1 2 -1 -2 -2 -1 2 -1 Z" fill="currentColor" stroke-width="1"/>

        <path d="M110 1 L118 7 L110 13 L102 7 Z" fill="currentColor"/>

</svg>

<header class="barre">
  <a class="marque" href="#/">Bazar d'Épervine</a>
  <nav class="menu" id="menu" aria-label="Rayons"><a href="#/" class="actif">Accueil</a></nav>
  <button class="loupe" id="bouton-recherche" aria-label="Chercher un article" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
  </button>
</header>
<div class="recherche-zone" id="recherche-zone">
  <input id="recherche" type="search" placeholder="Chercher un article…" aria-label="Chercher un article" autocomplete="off">
</div>

<section class="banniere" id="banniere">
  <svg class="fond" aria-hidden="true">
    <defs>
      <pattern id="losanges" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M22 0 L44 22 L22 44 L0 22 Z" fill="none" stroke="#bbbbf7" stroke-opacity=".09" stroke-width="1.2"/>
        <circle cx="22" cy="22" r="1.6" fill="#bbbbf7" fill-opacity=".12"/>
      </pattern>
      <radialGradient id="voile" cx="50%" cy="40%" r="70%">
        <stop offset=".35" stop-color="#0f0b1f" stop-opacity="0"/><stop offset="1" stop-color="#0f0b1f" stop-opacity=".85"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#losanges)"/>
    <rect width="100%" height="100%" fill="url(#voile)"/>
  </svg>
  <div class="etendard">
    <div class="hampe"></div>
    <div class="toile"><div class="bord"><div class="coeur">
      <svg class="embleme" aria-hidden="true"><use href="#epervier"/></svg>
      <h1 id="titre-banniere">Bazar d'Épervine</h1>
      <p class="devise" id="devise-banniere">Catalogue des articles disponibles</p>

  </div>
</section>

<main id="contenu">
  <div class="articles" aria-hidden="true">
    <div class="fantome"></div><div class="fantome"></div><div class="fantome"></div><div class="fantome"></div>
  </div>

<footer>Liste lue en direct dans les registres du bazar. Stock et prix peuvent changer : demandez au comptoir.</footer>

<div class="loupe-photo" id="loupe-photo" role="dialog" aria-label="Photo agrandie">
  <figure style="margin:0"><img id="loupe-image" alt=""><p id="loupe-legende"></p></figure>
</div>

<script>
// Adresse de la page Apps Script du catalogue (celle qui finit par /exec).
var ADRESSE_CATALOGUE = "https://script.google.com/macros/s/AKfycbzJdjFnjtl7kgRPwA5783eZoWqASe53DbTYxWR8mfcPbzZoTPlNTDDFDyVV54jDiBo/exec";

// Texte de la page d'accueil : à modifier librement.
var ACCUEIL = {
  titre: "Catalogue du Bazar d'Épervine",
  paragraphes: [
    "Bienvenue au Bazar d'Épervine. Vous trouverez ici les articles disponibles en ce moment au comptoir, avec leurs prix en septims.",
    "Le catalogue se met à jour tout seul à partir des registres du bazar : ce qui est affiché est ce qui est en stock.",
    "Pour toute commande ou question, adressez-vous au comptoir."
  ]
};

// Enchantements : service d'Aelindor Valarion, à part des comptes du bazar.
// La liste et les prix ne sont tapés qu'ici : à modifier librement.
var ATELIER = {
  adresse: "enchantements",
  titre: "Enchantements",
  paragraphes: [
    "Aelindor Valarion, enchanteur, propose ses services au bazar. Apportez votre pièce d'équipement, ou choisissez-en une parmi nos articles : il y fixe l'enchantement de votre choix.",
    "Le prix indiqué est celui de l'enchantement seul, gemme spirituelle comprise."
  ],
  liste: [
    { nom: "Fortifier la magie mineure", effet: "+20 Magie", prix: 900 },
    { nom: "Fortifier la vigueur mineure", effet: "+20 Vigueur", prix: 900 },
    { nom: "Régénération de magie mineure", effet: "La magie se régénère 40 % plus vite", prix: 900 },
    { nom: "Régénération de vigueur mineure", effet: "La vigueur se régénère 20 % plus vite", prix: 900 },
    { nom: "Régénération de santé mineure", effet: "La santé se régénère 10 % plus vite", prix: 900 },
    { nom: "Fortifier la charge mineure", effet: "+25 Charge", prix: 900 }
  ],
  remarque: "Armures et vêtements uniquement : les armes et les bijoux ne peuvent pas être enchantés pour le moment."
};

var contenu = document.getElementById("contenu");
var menu = document.getElementById("menu");
var champ = document.getElementById("recherche");
var zoneRecherche = document.getElementById("recherche-zone");
var boutonRecherche = document.getElementById("bouton-recherche");
var banniere = document.getElementById("banniere");
var titreBanniere = document.getElementById("titre-banniere");
var deviseBanniere = document.getElementById("devise-banniere");
var donnees = null;
var monnaie = "septims";

function norm(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}
function adresse(categorie) {
  return norm(categorie).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function prixTexte(n) {
  var r = Math.round(n * 100) / 100;
  var parties = (Number.isInteger(r) ? String(r) : r.toFixed(2)).split(".");
  parties[0] = parties[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return parties.join(",");
}
function element(balise, classe, texte) {
  var e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined) e.textContent = texte;
  return e;
}
function svgUse(id, classe) {
  var ns = "http://www.w3.org/2000/svg";
  var s = document.createElementNS(ns, "svg");
  s.setAttribute("aria-hidden", "true");
  if (classe) s.setAttribute("class", classe);
  s.setAttribute("viewBox", id === "filet" ? "0 0 220 14" : id === "rune" ? "0 0 48 48" : "0 0 200 200");
  var u = document.createElementNS(ns, "use");
  u.setAttribute("href", "#" + id);
  s.appendChild(u);
  return s;
}
function pluriel(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }

function message(texte, avecBouton) {
  contenu.textContent = "";
  var p = element("p", "message", texte);
  if (avecBouton) {
    var b = element("button", "", "Réessayer");
    b.addEventListener("click", function () { contenu.textContent = ""; charger(); });
    p.appendChild(b);
  }
  contenu.appendChild(p);
}

function enTete(titre, sousTitre, grande) {
  banniere.classList.toggle("petite", !grande);
  titreBanniere.textContent = titre;
  deviseBanniere.textContent = sousTitre;
}

function carteArticle(a, rubrique) {
  var carte = element("article", "article");
  var cadre = element("div", "photo");
  if (a.photo) {
    var img = document.createElement("img");
    img.src = a.photo; img.alt = a.nom; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.remove(); cadre.appendChild(ornement()); });
    img.addEventListener("click", function () { agrandir(a.photo, a.nom); });
    cadre.appendChild(img);
  } else {
    cadre.appendChild(ornement());
  }
  carte.appendChild(cadre);
  var infos = element("div", "infos");
  infos.appendChild(element("h3", "", a.nom));
  if (a.enchantement) infos.appendChild(element("p", "enchant", "Enchanté : " + a.enchantement));
  if (rubrique) infos.appendChild(element("p", "rubrique", rubrique));
  infos.appendChild(prixElement(a.prix));
  carte.appendChild(infos);
  return carte;
}
function ornement() {
  var o = element("div", "ornement");
  o.appendChild(svgUse("epervier"));
  return o;
}

function listeEnchantements() { return ATELIER.liste; }

function prixElement(prix) {
  if (prix === null || prix === undefined) return element("div", "prix demande", "Prix sur demande");
  var p = element("div", "prix", prixTexte(prix) + " ");
  p.appendChild(element("small", "", monnaie));
  return p;
}

function carteEnchantement(e) {
  var carte = element("article", "enchantement");
  carte.appendChild(svgUse("rune", "rune"));
  carte.appendChild(element("h3", "", e.nom));
  if (e.effet) carte.appendChild(element("p", "effet", e.effet));
  carte.appendChild(prixElement(e.prix));
  return carte;
}

function grilleEnchantements(liste) {
  var grille = element("div", "enchantements");
  liste.forEach(function (e) { grille.appendChild(carteEnchantement(e)); });
  return grille;
}

// Prix affiché en tête : « 900 septims » si tous les enchantements ont le même prix,
// « dès 900 septims » sinon.
function tarifEnchantements() {
  var prix = listeEnchantements().map(function (e) { return e.prix; }).filter(function (p) { return p !== null && p !== undefined; });
  if (!prix.length) return "";
  var mini = Math.min.apply(null, prix);
  var unique = prix.every(function (p) { return p === mini; });
  return (unique ? "" : "dès ") + prixTexte(mini) + " " + monnaie;
}

function pageEnchantements() {
  var liste = listeEnchantements();
  var tarif = tarifEnchantements();
  enTete(ATELIER.titre, pluriel(liste.length, "enchantement") + " proposé" + (liste.length > 1 ? "s" : "") + (tarif ? " · " + tarif : ""), false);
  contenu.textContent = "";
  var intro = element("div", "intro-atelier");
  ATELIER.paragraphes.forEach(function (p) { intro.appendChild(element("p", "", p)); });
  if (ATELIER.remarque) intro.appendChild(element("p", "remarque", ATELIER.remarque));
  contenu.appendChild(intro);
  contenu.appendChild(svgUse("filet", "filet"));
  contenu.appendChild(grilleEnchantements(liste));
}

function blocAtelier() {
  var liste = listeEnchantements();
  var lien = element("a", "atelier");
  lien.href = "#/" + ATELIER.adresse;
  lien.appendChild(svgUse("rune", "rune"));
  var texte = element("div");
  texte.appendChild(element("strong", "", "Atelier d'enchantement"));
  texte.appendChild(element("span", "", pluriel(liste.length, "enchantement") + " pour vos armures et vêtements"));
  lien.appendChild(texte);
  var tarif = tarifEnchantements();
  if (tarif) {
    var t = element("div", "tarif", tarif);
    t.appendChild(element("small", "", "par enchantement"));
    lien.appendChild(t);
  }
  return lien;
}

function pageAccueil() {
  enTete(donnees.titre || "Bazar d'Épervine", "Catalogue des articles disponibles", true);
  contenu.textContent = "";

  var pres = element("section", "presentation");
  var blason = element("div", "blason");
  var s = svgUse("epervier"); s.style.color = "#bbbbf7"; blason.appendChild(s);
  pres.appendChild(blason);
  var texte = element("div", "texte");
  texte.appendChild(element("h2", "", ACCUEIL.titre));
  ACCUEIL.paragraphes.forEach(function (p) { texte.appendChild(element("p", "", p)); });
  pres.appendChild(texte);
  contenu.appendChild(pres);
  if (listeEnchantements().length) contenu.appendChild(blocAtelier());

  contenu.appendChild(element("h2", "", "Nos rayons"));
  contenu.appendChild(svgUse("filet", "filet"));
  if (!donnees.groupes.length) { contenu.appendChild(element("p", "message", "Aucun article disponible pour le moment.")); return; }
  var grille = element("div", "rayons");
  donnees.groupes.forEach(function (g) {
    var lien = element("a", "rayon");
    lien.href = "#/" + adresse(g.categorie);
    var vignette = element("div", "vignette");
    var avecPhoto = g.articles.filter(function (a) { return a.photo; })[0];
    if (avecPhoto) {
      var img = document.createElement("img");
      img.src = avecPhoto.photo; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
      vignette.appendChild(img);
    } else {
      vignette.style.display = "grid"; vignette.style.placeItems = "center"; vignette.style.color = "rgba(187,187,247,.35)";
      var e = svgUse("epervier"); e.style.width = "34%"; vignette.appendChild(e);
    }
    lien.appendChild(vignette);
    lien.appendChild(element("div", "nom", g.categorie));
    lien.appendChild(element("div", "nb", pluriel(g.articles.length, "article")));
    grille.appendChild(lien);
  });
  contenu.appendChild(grille);
}

function pageRayon(g) {
  enTete(g.categorie, pluriel(g.articles.length, "article") + " disponible" + (g.articles.length > 1 ? "s" : ""), false);
  contenu.textContent = "";
  var grille = element("div", "articles");
  g.articles.forEach(function (a) { grille.appendChild(carteArticle(a)); });
  contenu.appendChild(grille);
}

function pageRecherche(q) {
  var n = norm(q);
  var trouves = [];
  donnees.groupes.forEach(function (g) {
    g.articles.forEach(function (a) {
      if (norm(a.nom + " " + a.enchantement + " " + g.categorie).indexOf(n) >= 0) trouves.push([a, g.categorie]);
    });
  });
  var sorts = listeEnchantements().filter(function (e) { return norm(e.nom + " " + e.effet + " enchantement").indexOf(n) >= 0; });
  var total = trouves.length + sorts.length;
  enTete("Recherche", total ? pluriel(total, "résultat") + " pour « " + q.trim() + " »" : "« " + q.trim() + " »", false);
  contenu.textContent = "";
  if (!total) { message("Aucun article ne correspond à votre recherche."); return; }
  if (trouves.length) {
    if (sorts.length) contenu.appendChild(element("h2", "titre-resultats", "Articles"));
    var grille = element("div", "articles");
    trouves.forEach(function (t) { grille.appendChild(carteArticle(t[0], t[1])); });
    contenu.appendChild(grille);
  }
  if (sorts.length) {
    contenu.appendChild(element("h2", "titre-resultats", "Enchantements"));
    contenu.appendChild(grilleEnchantements(sorts));
  }
}

function construireMenu() {
  menu.textContent = "";
  var accueil = element("a", "", "Accueil"); accueil.href = "#/"; accueil.dataset.page = "";
  menu.appendChild(accueil);
  donnees.groupes.forEach(function (g) {
    var a = element("a", "", g.categorie);
    a.href = "#/" + adresse(g.categorie); a.dataset.page = adresse(g.categorie);
    menu.appendChild(a);
  });
  if (listeEnchantements().length) {
    var e = element("a", "", ATELIER.titre);
    e.href = "#/" + ATELIER.adresse; e.dataset.page = ATELIER.adresse;
    menu.appendChild(e);
  }
}

function afficherPage() {
  if (!donnees) return;
  var page = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  var q = champ.value.trim();
  if (q && zoneRecherche.classList.contains("ouverte")) {
    pageRecherche(q);
  } else {
    var g = donnees.groupes.filter(function (x) { return adresse(x.categorie) === page; })[0];
    if (g) pageRayon(g);
    else if (page === ATELIER.adresse && listeEnchantements().length) pageEnchantements();
    else { page = ""; pageAccueil(); }
  }
  menu.querySelectorAll("a").forEach(function (a) {
    var actif = !q && a.dataset.page === page;
    a.classList.toggle("actif", actif);
    if (actif) a.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}

function charger() {
  fetch(ADRESSE_CATALOGUE + "?format=json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      donnees = d;
      if (d.monnaie) monnaie = d.monnaie;
      construireMenu();
      afficherPage();
    })
    .catch(function () { message("Le catalogue est momentanément indisponible.", true); });
}

// Recherche : la loupe ouvre le champ, taper filtre tout le catalogue.
boutonRecherche.addEventListener("click", function () {
  var ouverte = zoneRecherche.classList.toggle("ouverte");
  boutonRecherche.setAttribute("aria-expanded", ouverte);
  if (ouverte) champ.focus(); else { champ.value = ""; afficherPage(); }
});
champ.addEventListener("input", function () { afficherPage(); window.scrollTo(0, 0); });
champ.addEventListener("keydown", function (e) { if (e.key === "Escape") boutonRecherche.click(); });
window.addEventListener("hashchange", function () {
  if (champ.value) { champ.value = ""; zoneRecherche.classList.remove("ouverte"); boutonRecherche.setAttribute("aria-expanded", "false"); }
  afficherPage();
  window.scrollTo(0, 0);
});

// Photo agrandie
var loupe = document.getElementById("loupe-photo");
function agrandir(src, legende) {
  document.getElementById("loupe-image").src = src;
  document.getElementById("loupe-image").alt = legende;
  document.getElementById("loupe-legende").textContent = legende;
  loupe.classList.add("ouverte");
}
loupe.addEventListener("click", function () { loupe.classList.remove("ouverte"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") loupe.classList.remove("ouverte"); });

charger();
</script>
</body>
</html>
