<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazar d'Épervine, catalogue</title>
<meta name="description" content="Catalogue du Bazar d'Épervine : articles disponibles en ce moment et leurs prix en septims.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Alegreya:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --parchemin: #d7cba9;
  --parchemin-clair: #e4dabd;
  --parchemin-fonce: #c5b68e;
  --encre: #1f1b14;
  --encre-douce: #4a4031;
  --brun: #5a4a32;
  --bande: #5b5640;
  --nuit: #1d1a15;
  --or: #ffd966;
  --or-fonce: #9a7428;
  --enchant: #2f5e8c;
  --trait: rgba(60, 45, 25, .28);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
  margin: 0;
  background: var(--parchemin);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.18), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(120,90,40,.12), transparent 60%);
  color: var(--encre);
  font-family: Alegreya, Georgia, serif;
  font-size: 18px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; }
img { display: block; max-width: 100%; }

/* Barre du haut */
.barre {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 18px;
  padding: 0 20px; height: 56px;
  background: rgba(29, 26, 21, .92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(255, 217, 102, .18);
}
.marque {
  font-family: Metamorphous, serif; color: #f4ecd8; text-decoration: none;
  font-size: 1.05rem; white-space: nowrap; flex: 0 0 auto;
}
.menu {
  display: flex; gap: 4px; margin-left: auto; overflow-x: auto;
  scrollbar-width: none; min-width: 0;
}
.menu::-webkit-scrollbar { display: none; }
.menu a {
  font-family: Metamorphous, serif; font-size: .9rem; color: #d9d1bd;
  text-decoration: none; white-space: nowrap; padding: 6px 10px; border-radius: 4px;
}
.menu a:hover { color: #fff; }
.menu a.actif { color: #fff; font-weight: 700; text-shadow: 0 0 1px #fff; }
.loupe {
  flex: 0 0 auto; background: none; border: 0; color: #d9d1bd; cursor: pointer;
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
}
.loupe:hover { color: #fff; background: rgba(255,255,255,.08); }
.recherche-zone {
  display: none; position: sticky; top: 56px; z-index: 9;
  background: rgba(29, 26, 21, .95); padding: 10px 20px 14px;
}
.recherche-zone.ouverte { display: block; }
#recherche {
  display: block; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 10px 14px; border-radius: 6px; border: 1px solid rgba(255,217,102,.35);
  background: #2a261f; color: #f4ecd8; font: inherit; font-size: 17px;
}
#recherche:focus { outline: 2px solid var(--or); outline-offset: 1px; }

/* Bannière */
.banniere {
  position: relative; overflow: hidden; text-align: center;
  background: #3a3226;
  color: var(--or);
}
.banniere svg.decor { position: absolute; inset: 0; width: 100%; height: 100%; }
.banniere .contenu { position: relative; padding: 70px 20px 78px; }
.banniere.petite .contenu { padding: 34px 20px 40px; }
.banniere h1 {
  margin: 0; font-family: Metamorphous, serif; font-weight: 400;
  font-size: clamp(2.3rem, 7vw, 4.6rem); line-height: 1.1;
  text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.6);
}
.banniere.petite h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
.banniere .devise {
  margin: 10px 0 0; font-family: Metamorphous, serif; font-size: clamp(.95rem, 2.4vw, 1.2rem);
  color: #f1e6c8; text-shadow: 0 1px 6px rgba(0,0,0,.8);
}

main { flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 36px 20px 40px; }
h2 {
  font-family: Metamorphous, serif; font-weight: 400; color: var(--encre);
  font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.2; margin: 0 0 16px; text-align: center;
}
.filet {
  width: 220px; height: 14px; margin: 0 auto 28px; display: block; color: var(--brun);
}

/* Accueil */
.presentation {
  display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; margin-bottom: 48px;
}
.presentation .blason {
  background: var(--nuit); border-radius: 4px; padding: 24px; display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(40, 28, 10, .25); aspect-ratio: 4 / 3;
}
.presentation .blason svg { width: 70%; height: auto; }
.presentation .texte { text-align: center; }
.presentation .texte h2 { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.presentation .texte p { margin: 0 0 12px; font-size: 1.05rem; }
.rayons {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
}
.rayon {
  position: relative; display: flex; flex-direction: column; text-decoration: none;
  background: var(--parchemin-clair); border: 1px solid var(--trait); border-radius: 4px; overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.rayon:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(60, 40, 10, .2); }
.rayon .vignette { aspect-ratio: 4 / 3; background: var(--bande); }
.rayon .vignette img { width: 100%; height: 100%; object-fit: cover; }
.rayon .nom { font-family: Metamorphous, serif; font-size: 1.1rem; padding: 12px 14px 2px; }
.rayon .nb { font-size: .92rem; color: var(--encre-douce); padding: 0 14px 12px; font-style: italic; }

/* Page d'une catégorie */
.articles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
.article {
  display: flex; flex-direction: column; background: var(--parchemin-clair);
  border: 1px solid var(--trait); border-radius: 4px; overflow: hidden;
  box-shadow: 0 2px 0 rgba(90, 70, 40, .08);
}
.article .photo { aspect-ratio: 4 / 5; background: var(--bande); position: relative; }
.article .photo img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.article .photo .ornement { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255, 217, 102, .35); }
.article .photo .ornement svg { width: 46%; height: auto; }
.article .infos { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.article h3 { margin: 0; font-family: Metamorphous, serif; font-weight: 400; font-size: 1.08rem; line-height: 1.3; overflow-wrap: anywhere; }
.article .enchant { margin: 0; font-size: .95rem; color: var(--enchant); font-style: italic; }
.article .rubrique { margin: 0; font-size: .85rem; color: var(--encre-douce); }
.article .prix {
  margin-top: auto; padding-top: 8px; font-family: Metamorphous, serif; font-size: 1.15rem; color: var(--or-fonce);
}
.article .prix small { font-family: Alegreya, serif; font-size: .85rem; color: var(--encre-douce); }
.article .prix.demande { font-family: Alegreya, serif; font-style: italic; font-size: .95rem; color: var(--encre-douce); }

.message { text-align: center; font-style: italic; color: var(--encre-douce); margin: 40px 0; }
.message button {
  display: block; margin: 16px auto 0; font-family: Metamorphous, serif; font-size: .9rem;
  padding: 8px 18px; border-radius: 999px; border: 1px solid var(--brun); background: transparent;
  color: var(--encre); cursor: pointer;
}
.message button:hover { background: var(--parchemin-fonce); }
.fantome { background: var(--parchemin-fonce); border-radius: 4px; aspect-ratio: 4 / 5; animation: lueur 1.4s ease-in-out infinite; }
@keyframes lueur { 50% { opacity: .55; } }

footer {
  text-align: center; font-size: .9rem; color: #cfc6b0; background: var(--nuit);
  padding: 22px 20px; font-style: italic;
}

/* Agrandissement d'une photo */
.loupe-photo {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 8, 5, .88);
  display: none; place-items: center; padding: 20px; cursor: zoom-out;
}
.loupe-photo.ouverte { display: grid; }
.loupe-photo img { max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.loupe-photo p { color: #f4ecd8; font-family: Metamorphous, serif; text-align: center; margin: 12px 0 0; }

@media (max-width: 720px) {
  body { font-size: 17px; }
  .barre { padding: 0 12px; gap: 10px; }
  .marque { display: none; }
  .menu { margin-left: 0; }
  .banniere .contenu { padding: 48px 16px 54px; }
  main { padding: 26px 16px 32px; }
  .presentation { grid-template-columns: 1fr; gap: 22px; }
  .presentation .blason { aspect-ratio: 16 / 9; }
  .presentation .blason svg { width: 45%; }
  .rayons { grid-template-columns: 1fr 1fr; gap: 10px; }
  .rayon .nom { font-size: .98rem; padding: 10px 10px 0; }
  .rayon .nb { padding: 0 10px 10px; font-size: .85rem; }
  .articles { grid-template-columns: 1fr 1fr; gap: 10px; }
  .article .infos { padding: 9px 10px 11px; }
  .article h3 { font-size: .98rem; }
  .article .prix { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) { .fantome { animation: none; } .rayon { transition: none; } }
</style>
</head>
<body>

<header class="barre">
  <a class="marque" href="#/">Bazar d'Épervine</a>
  <nav class="menu" id="menu" aria-label="Rayons"><a href="#/" class="actif">Accueil</a></nav>
  <button class="loupe" id="bouton-recherche" aria-label="Chercher un article" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg>
  </button>
</header>
<div class="recherche-zone" id="recherche-zone">
  <input id="recherche" type="search" placeholder="Chercher un article…" aria-label="Chercher un article" autocomplete="off">

<section class="banniere" id="banniere">
  <svg class="decor" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

<footer>Liste lue en direct dans les registres du bazar. Stock et prix peuvent changer : demandez au comptoir.</footer>

<script>
// Adresse de la page Apps Script du catalogue (celle qui finit par /exec).
var ADRESSE_CATALOGUE = "https://script.google.com/macros/s/AKfycbzJdjFnjtl7kgRPwA5783eZoWqASe53DbTYxWR8mfcPbzZoTPlNTDDFDyVV54jDiBo/exec";

// Texte de la page d'accueil : à modifier librement.
var ACCUEIL = {
  titre: "Catalogue du Bazar d'Épervine",
  paragraphes: [
    "Bienvenue au Bazar d'Épervine. Vous trouverez ici les articles disponibles en ce moment au comptoir, avec leurs prix en septims.",
    "Le catalogue se met à jour tout seul à partir des registres du bazar : ce qui est affiché est ce qui est en stock.",
    "Pour toute commande ou question, adressez-vous au comptoir."
  ]
};

var contenu = document.getElementById("contenu");
var menu = document.getElementById("menu");
var champ = document.getElementById("recherche");
var zoneRecherche = document.getElementById("recherche-zone");
var boutonRecherche = document.getElementById("bouton-recherche");
var banniere = document.getElementById("banniere");
var titreBanniere = document.getElementById("titre-banniere");
var deviseBanniere = document.getElementById("devise-banniere");
var donnees = null;
var monnaie = "septims";

function norm(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}
function adresse(categorie) {
  return norm(categorie).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function prixTexte(n) {
  var r = Math.round(n * 100) / 100;
  var parties = (Number.isInteger(r) ? String(r) : r.toFixed(2)).split(".");
  parties[0] = parties[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return parties.join(",");
}
function element(balise, classe, texte) {
  var e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined) e.textContent = texte;
  return e;
}
function svgUse(id, classe) {
  var ns = "http://www.w3.org/2000/svg";
  var s = document.createElementNS(ns, "svg");
  s.setAttribute("aria-hidden", "true");
  if (classe) s.setAttribute("class", classe);
  s.setAttribute("viewBox", id === "filet" ? "0 0 220 14" : "0 0 200 200");
  var u = document.createElementNS(ns, "use");
  u.setAttribute("href", "#" + id);
  s.appendChild(u);
  return s;
}
function pluriel(n, mot) { return n + " " + mot + (n > 1 ? "s" : ""); }

function message(texte, avecBouton) {
  contenu.textContent = "";
  var p = element("p", "message", texte);
  if (avecBouton) {
    var b = element("button", "", "Réessayer");
    b.addEventListener("click", function () { contenu.textContent = ""; charger(); });
    p.appendChild(b);
  }
  contenu.appendChild(p);
}

function enTete(titre, sousTitre, grande) {
  banniere.classList.toggle("petite", !grande);
  titreBanniere.textContent = titre;
  deviseBanniere.textContent = sousTitre;
}

function carteArticle(a, rubrique) {
  var carte = element("article", "article");
  var cadre = element("div", "photo");
  if (a.photo) {
    var img = document.createElement("img");
    img.src = a.photo; img.alt = a.nom; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.addEventListener("error", function () { img.remove(); cadre.appendChild(ornement()); });
    img.addEventListener("click", function () { agrandir(a.photo, a.nom); });
    cadre.appendChild(img);
  } else {
    cadre.appendChild(ornement());
  }
  carte.appendChild(cadre);
  var infos = element("div", "infos");
  infos.appendChild(element("h3", "", a.nom));
  if (a.enchantement) infos.appendChild(element("p", "enchant", "Enchanté : " + a.enchantement));
  if (rubrique) infos.appendChild(element("p", "rubrique", rubrique));
  if (a.prix === null) {
    infos.appendChild(element("div", "prix demande", "Prix sur demande"));
  } else {
    var prix = element("div", "prix", prixTexte(a.prix) + " ");
    prix.appendChild(element("small", "", monnaie));
    infos.appendChild(prix);
  }
  carte.appendChild(infos);
  return carte;
}
function ornement() {
  var o = element("div", "ornement");
  o.appendChild(svgUse("epervier"));
  return o;
}

function pageAccueil() {
  enTete(donnees.titre || "Bazar d'Épervine", "Catalogue des articles disponibles", true);
  contenu.textContent = "";

  var pres = element("section", "presentation");
  var blason = element("div", "blason");
  var s = svgUse("epervier"); s.style.color = "#c9a64e"; blason.appendChild(s);
  pres.appendChild(blason);
  var texte = element("div", "texte");
  texte.appendChild(element("h2", "", ACCUEIL.titre));
  ACCUEIL.paragraphes.forEach(function (p) { texte.appendChild(element("p", "", p)); });
  pres.appendChild(texte);
  contenu.appendChild(pres);

  contenu.appendChild(element("h2", "", "Nos rayons"));
  contenu.appendChild(svgUse("filet", "filet"));
  if (!donnees.groupes.length) { contenu.appendChild(element("p", "message", "Aucun article disponible pour le moment.")); return; }
  var grille = element("div", "rayons");
  donnees.groupes.forEach(function (g) {
    var lien = element("a", "rayon");
    lien.href = "#/" + adresse(g.categorie);
    var vignette = element("div", "vignette");
    var avecPhoto = g.articles.filter(function (a) { return a.photo; })[0];
    if (avecPhoto) {
      var img = document.createElement("img");
      img.src = avecPhoto.photo; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
      vignette.appendChild(img);
    } else {
      vignette.style.display = "grid"; vignette.style.placeItems = "center"; vignette.style.color = "rgba(255,217,102,.35)";
      var e = svgUse("epervier"); e.style.width = "34%"; vignette.appendChild(e);
    }
    lien.appendChild(vignette);
    lien.appendChild(element("div", "nom", g.categorie));
    lien.appendChild(element("div", "nb", pluriel(g.articles.length, "article")));
    grille.appendChild(lien);
  });
  contenu.appendChild(grille);
}

function pageRayon(g) {
  enTete(g.categorie, pluriel(g.articles.length, "article") + " disponible" + (g.articles.length > 1 ? "s" : ""), false);
  contenu.textContent = "";
  var grille = element("div", "articles");
  g.articles.forEach(function (a) { grille.appendChild(carteArticle(a)); });
  contenu.appendChild(grille);
}

function pageRecherche(q) {
  var n = norm(q);
  var trouves = [];
  donnees.groupes.forEach(function (g) {
    g.articles.forEach(function (a) {
      if (norm(a.nom + " " + a.enchantement + " " + g.categorie).indexOf(n) >= 0) trouves.push([a, g.categorie]);
    });
  });
  enTete("Recherche", trouves.length ? pluriel(trouves.length, "article") + " pour « " + q.trim() + " »" : "« " + q.trim() + " »", false);
  contenu.textContent = "";
  if (!trouves.length) { message("Aucun article ne correspond à votre recherche."); return; }
  var grille = element("div", "articles");
  trouves.forEach(function (t) { grille.appendChild(carteArticle(t[0], t[1])); });
  contenu.appendChild(grille);
}

function construireMenu() {
  menu.textContent = "";
  var accueil = element("a", "", "Accueil"); accueil.href = "#/"; accueil.dataset.page = "";
  menu.appendChild(accueil);
  donnees.groupes.forEach(function (g) {
    var a = element("a", "", g.categorie);
    a.href = "#/" + adresse(g.categorie); a.dataset.page = adresse(g.categorie);
    menu.appendChild(a);
  });
}

function afficherPage() {
  if (!donnees) return;
  var page = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  var q = champ.value.trim();
  if (q && zoneRecherche.classList.contains("ouverte")) {
    pageRecherche(q);
  } else {
    var g = donnees.groupes.filter(function (x) { return adresse(x.categorie) === page; })[0];
    if (g) pageRayon(g); else { page = ""; pageAccueil(); }
  }
  menu.querySelectorAll("a").forEach(function (a) {
    var actif = !q && a.dataset.page === page;
    a.classList.toggle("actif", actif);
    if (actif) a.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
}

function charger() {
  fetch(ADRESSE_CATALOGUE + "?format=json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      donnees = d;
      if (d.monnaie) monnaie = d.monnaie;
      construireMenu();
      afficherPage();
    })
    .catch(function () { message("Le catalogue est momentanément indisponible.", true); });
}

// Recherche : la loupe ouvre le champ, taper filtre tout le catalogue.
boutonRecherche.addEventListener("click", function () {
  var ouverte = zoneRecherche.classList.toggle("ouverte");
  boutonRecherche.setAttribute("aria-expanded", ouverte);
  if (ouverte) champ.focus(); else { champ.value = ""; afficherPage(); }
});
champ.addEventListener("input", function () { afficherPage(); window.scrollTo(0, 0); });
champ.addEventListener("keydown", function (e) { if (e.key === "Escape") boutonRecherche.click(); });
window.addEventListener("hashchange", function () {
  if (champ.value) { champ.value = ""; zoneRecherche.classList.remove("ouverte"); boutonRecherche.setAttribute("aria-expanded", "false"); }
  afficherPage();
  window.scrollTo(0, 0);
});

// Photo agrandie
var loupe = document.getElementById("loupe-photo");
function agrandir(src, legende) {
  document.getElementById("loupe-image").src = src;
  document.getElementById("loupe-image").alt = legende;
  document.getElementById("loupe-legende").textContent = legende;
  loupe.classList.add("ouverte");
}
loupe.addEventListener("click", function () { loupe.classList.remove("ouverte"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") loupe.classList.remove("ouverte"); });

charger();
</script>
</body>
